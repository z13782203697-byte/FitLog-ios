name: Build FitLog iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS Simulator app
        run: |
          xcodebuild             -project FitLogIOS.xcodeproj             -scheme FitLogIOS             -sdk iphonesimulator             -configuration Debug             CODE_SIGNING_ALLOWED=NO             build
