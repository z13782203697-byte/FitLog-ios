name: FitLogIOS
options:
  bundleIdPrefix: com.fitlog
  deploymentTarget:
    iOS: '17.0'
targets:
  FitLogIOS:
    type: application
    platform: iOS
    sources:
      - FitLogIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitlog.ios
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 训练日历
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: '1,2'
