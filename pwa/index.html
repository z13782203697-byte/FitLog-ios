<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="训练日历"><link rel="manifest" href="./manifest.webmanifest"><title>训练日历</title>
<style>:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#0f766e;--dark:#111827}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}.app{max-width:720px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}h1{font-size:28px;margin:4px 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.monthbar,.daybar{display:flex;align-items:center;gap:10px}.monthbar{justify-content:space-between}button{font:inherit;border:0;border-radius:12px;padding:10px 12px;background:#f1f5f9;color:var(--text)}.primary{background:var(--dark);color:#fff;font-weight:600}.monthtitle{font-weight:700}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week{margin-top:12px;color:var(--muted);font-size:12px;text-align:center}.day{height:48px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:transparent}.day.sel{background:var(--dark);color:#fff}.day.today:not(.sel){color:var(--accent);font-weight:700}.dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}.sel .dot{background:#fff}.daybar{margin:14px 0 10px}.daybar h2{font-size:20px;margin:0;flex:1}.record{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}.recordtop{display:flex;gap:10px;align-items:baseline}.recordtop strong{font-size:18px}.ago{margin-left:auto;color:var(--accent);font-weight:700;font-size:13px;text-align:right}.meta{color:var(--muted);font-size:12px;margin-top:4px}.metrics{font-size:14px;margin-top:8px}.note{color:#475569;font-size:13px;margin-top:8px}.empty{text-align:center;color:var(--muted);padding:48px 10px}dialog{border:0;border-radius:18px;width:min(92vw,560px);padding:0}.dlg{padding:16px}.dlg h3{margin:0 0 10px}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:6px 0;background:#fff}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}.chips button{white-space:nowrap;font-size:12px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}</style></head><body>
<div class="app"><h1>训练日历</h1><div class="sub">记录训练，也记录身体恢复的时间</div><div class="card"><div class="monthbar"><button id="prev">‹</button><div class="monthtitle" id="monthTitle"></div><button id="next">›</button></div><div class="week"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div><div class="grid" id="calendar"></div></div><div class="daybar"><h2 id="selectedTitle"></h2><button class="primary" id="addBtn">＋ 记录训练</button></div><div id="records"></div></div>
<dialog id="dlg"><form method="dialog" class="dlg" id="form"><h3>记录训练</h3><input id="exercise" placeholder="训练项目，例如：卧推 / 深蹲 / 跑步" required><div class="chips" id="chips"></div><div class="row3"><input id="weight" inputmode="decimal" placeholder="重量kg"><input id="sets" inputmode="numeric" placeholder="组数"><input id="reps" inputmode="numeric" placeholder="次数"></div><input id="time" type="datetime-local" required><textarea id="note" rows="3" placeholder="备注（可选）"></textarea><div class="actions"><button value="cancel">取消</button><button class="primary" id="saveBtn" value="default">保存</button></div></form></dialog>
<script>
var KEY="fitlog-pwa-v1";var records=JSON.parse(localStorage.getItem(KEY)||"[]");var selected=new Date(),visible=new Date(selected.getFullYear(),selected.getMonth(),1);function $(id){return document.getElementById(id)}var cal=$("calendar"),list=$("records");var quick=["胸","背","腿","肩","二头","三头","跑步","卧推","深蹲","硬拉"];
$("chips").innerHTML=quick.map(function(x){return "<button type=\"button\" data-x=\""+x+"\">"+x+"</button>"}).join("");$("chips").onclick=function(e){if(e.target.dataset.x)$("exercise").value=e.target.dataset.x};
function persist(){localStorage.setItem(KEY,JSON.stringify(records))}function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function sameDay(a,b){return ymd(a)===ymd(b)}function elapsed(ts){var m=Math.max(0,Math.floor((Date.now()-ts)/60000)),h=Math.floor(m/60),mm=m%60;return h<24?"已过去 "+h+"小时"+mm+"分钟":"已过去 "+Math.floor(h/24)+"天"+(h%24)+"小时"+mm+"分钟"}function esc(s){s=s||"";return s.replace(/[&<>\"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function renderCalendar(){$("monthTitle").textContent=visible.getFullYear()+"年"+(visible.getMonth()+1)+"月";cal.innerHTML="";var first=new Date(visible.getFullYear(),visible.getMonth(),1),days=new Date(visible.getFullYear(),visible.getMonth()+1,0).getDate(),lead=(first.getDay()+6)%7;for(var i=0;i<lead;i++)cal.appendChild(document.createElement("div"));for(var day=1;day<=days;day++){(function(day){var d=new Date(visible.getFullYear(),visible.getMonth(),day),b=document.createElement("button");b.className="day"+(sameDay(d,selected)?" sel":"")+(sameDay(d,new Date())?" today":"");var has=records.some(function(r){return sameDay(new Date(r.ts),d)});b.innerHTML="<span>"+day+"</span>"+(has?"<span class=\"dot\"></span>":"<span style=\"height:5px\"></span>");b.onclick=function(){selected=d;renderCalendar();renderRecords()};cal.appendChild(b)})(day)}}
function renderRecords(){var today=sameDay(selected,new Date());$("selectedTitle").textContent=today?"今天":selected.toLocaleDateString("zh-CN",{month:"long",day:"numeric",weekday:"long"});var day=records.filter(function(r){return sameDay(new Date(r.ts),selected)}).sort(function(a,b){return b.ts-a.ts});if(!day.length){list.innerHTML="<div class=\"empty\">这一天还没有训练记录。<br>点击“记录训练”开始。</div>";return}list.innerHTML=day.map(function(r){var d=new Date(r.ts),parts=[];if(r.weight)parts.push("重量 "+r.weight+" kg");if(r.sets)parts.push("组数 "+r.sets);if(r.reps)parts.push("次数 "+r.reps);return "<div class=\"record\" data-id=\""+r.id+"\"><div class=\"recordtop\"><strong>"+esc(r.exercise)+"</strong><div class=\"ago\">"+elapsed(r.ts)+"</div></div><div class=\"meta\">记录时间 "+d.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",hour12:false})+"</div>"+(parts.length?"<div class=\"metrics\">"+parts.join("　")+"</div>":"")+(r.note?"<div class=\"note\">"+esc(r.note)+"</div>":"")+"</div>"}).join("")}
$("prev").onclick=function(){visible=new Date(visible.getFullYear(),visible.getMonth()-1,1);renderCalendar()};$("next").onclick=function(){visible=new Date(visible.getFullYear(),visible.getMonth()+1,1);renderCalendar()};$("addBtn").onclick=function(){$("exercise").value=$("weight").value=$("sets").value=$("reps").value=$("note").value="";var d=new Date(selected);if(!sameDay(d,new Date()))d.setHours(18,0,0,0);else d=new Date();function p(n){return String(n).padStart(2,"0")}$("time").value=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());$("dlg").showModal()};
$("form").addEventListener("submit",function(e){if(e.submitter&&e.submitter.value==="cancel")return;e.preventDefault();var ex=$("exercise").value.trim();if(!ex)return;var ts=new Date($("time").value).getTime();if(ts>Date.now()+60000){alert("记录时间不能晚于现在");return}records.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),ts:ts,exercise:ex,weight:$("weight").value.trim(),sets:$("sets").value.trim(),reps:$("reps").value.trim(),note:$("note").value.trim()});persist();selected=new Date(ts);visible=new Date(selected.getFullYear(),selected.getMonth(),1);$("dlg").close();renderCalendar();renderRecords()});
list.addEventListener("click",function(e){var card=e.target.closest(".record");if(!card)return;if(confirm("删除这条训练记录？")){records=records.filter(function(r){return r.id!==card.dataset.id});persist();renderCalendar();renderRecords()}});if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");renderCalendar();renderRecords();setInterval(renderRecords,60000);
</script></body></html>
